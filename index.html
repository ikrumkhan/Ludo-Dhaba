<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoDhaba</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 410px;
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .header {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #f59e0b;
        }
        .wallet-box {
            background: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #22c55e;
            font-weight: bold;
            cursor: pointer;
        }
        .content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }
        .banner {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 15px;
            border-radius: 10px;
            color: #0f172a;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .battle-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .battle-top {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .battle-middle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .prize {
            font-size: 16px;
            font-weight: bold;
            color: #22c55e;
        }
        .entry {
            font-size: 14px;
            color: #f59e0b;
        }
        .btn-play {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-create {
            background: #ef4444;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .bottom-nav {
            display: flex;
            background: #0f172a;
            border-top: 1px solid #334155;
            padding: 10px 0;
            justify-content: space-around;
        }
        .nav-link {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
        }
        .nav-link.active {
            color: #f59e0b;
            font-weight: bold;
        }
        .login-screen {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .login-logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 30px;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOGIN VIEW -->
        <div id="login-view" class="login-screen">
            <div class="login-logo">🎲 LudoDhaba</div>
            <label style="color: #94a3b8; margin-bottom: 5px; font-size: 14px;">Mobile Number (+91 ke sath likhein)</label>
            <input type="tel" id="mobile-input" class="input-box" value="+91">
            <button class="btn-main" onclick="sendOTP()">Send OTP</button>
            
            <!-- Hidden Recaptcha Container -->
            <div id="recaptcha-container"></div>

            <div id="otp-container" style="display: none; margin-top: 20px;">
                <label style="color: #94a3b8; margin-bottom: 5px; font-size: 14px;">OTP Dalein</label>
                <input type="text" id="otp-input" class="input-box" placeholder="6-digit OTP" maxlength="6">
                <button class="btn-main" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" style="display: none; flex-direction: column; height: 100%;">
            <div class="header">
                <div class="logo">🎲 LudoDhaba</div>
                <div class="wallet-box" onclick="openWallet()">💰 <span id="balance-text">₹500</span></div>
            </div>

            <div class="content">
                <div class="banner">
                    🚀 Ludo Khelein aur Real Cash Jeetein!
                </div>

                <button class="btn-create" onclick="createChallenge()">+ Create Challenge</button>

                <div class="section-title">Active Battles</div>
                
                <div id="challenges-list">
                    <div class="battle-card">
                        <div class="battle-top">
                            <span>Creator: Admin</span>
                            <span>Classic Mode</span>
                        </div>
                        <div class="battle-middle">
                            <div>
                                <div class="entry">Entry: ₹100</div>
                                <div class="prize">Prize: ₹190</div>
                            </div>
                            <button class="btn-play" onclick="joinBattle(100)">Play</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-nav">
                <div class="nav-link active">🏠<br>Home</div>
                <div class="nav-link" onclick="openWallet()">💳<br>Wallet</div>
                <div class="nav-link" onclick="alert('History Section')">📜<br>History</div>
                <div class="nav-link" onclick="alert('Profile Section')">👤<br>Profile</div>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAfdUuf53Xi6bxx7Jrd38CGXYNAWnb0QYs",
            authDomain: "ludo-badsah.firebaseapp.com",
            projectId: "ludo-badsah",
            storageBucket: "ludo-badsah.appspot.com",
            messagingSenderId: "1008082585739",
            appId: "1:1008082585739:web:8368c16ccde324a9956c8e"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        let confirmationResultObj;

        function sendOTP() {
            let phoneNumber = document.getElementById('mobile-input').value;

            // Setup Recaptcha on click to avoid initialization timing errors
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                    'size': 'invisible'
                });
            }

            let appVerifier = window.recaptchaVerifier;

            firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
                .then(function (confirmationResult) {
                    confirmationResultObj = confirmationResult;
                    document.getElementById('otp-container').style.display = 'block';
                    alert('OTP SMS successfully bhej diya gaya hai!');
                }).catch(function (error) {
                    console.error(error);
                    alert('OTP send karne mein error aayi: ' + error.message);
                });
        }

        function verifyOTP() {
            let code = document.getElementById('otp-input').value;
            confirmationResultObj.confirm(code).then(function (result) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'flex';
                alert('Login Successful!');
            }).catch(function (error) {
                alert('Galat OTP! Kripya dobara koshish karein.');
            });
        }

        let walletBalance = 500;

        function openWallet() {
            let amt = prompt("Kitna amount add karna hai?", "100");
            if(amt && !isNaN(amt)) {
                walletBalance += Number(amt);
                document.getElementById('balance-text').innerText = '₹' + walletBalance;
                alert('Successfully ₹' + amt + ' add ho gaye!');
            }
        }

        function createChallenge() {
            let amt = prompt("Battle Amount dalein (Jaise: 50, 100):", "100");
            if(amt && !isNaN(amt)) {
                let fee = Number(amt);
                if(walletBalance >= fee) {
                    walletBalance -= fee;
                    document.getElementById('balance-text').innerText = '₹' + walletBalance;
                    
                    let prizeCalc = fee * 1.9;
                    let list = document.getElementById('challenges-list');
                    list.innerHTML += `
                        <div class="battle-card">
                            <div class="battle-top">
                                <span>Creator: You</span>
                                <span>Classic Mode</span>
                            </div>
                            <div class="battle-middle">
                                <div>
                                    <div class="entry">Entry: ₹${fee}</div>
                                    <div class="prize">Prize: ₹${prizeCalc}</div>
                                </div>
                                <span style="color: #f59e0b; font-size: 13px; font-weight: bold;">Waiting...</span>
                            </div>
                        </div>
                    `;
                    alert('Challenge safalpurvak create ho gaya!');
                } else {
                    alert('Wallet mein paryapt balance nahi hai!');
                }
            }
        }

        function joinBattle(amount) {
            if(walletBalance >= amount) {
                walletBalance -= amount;
                document.getElementById('balance-text').innerText = '₹' + walletBalance;
                alert('Battle join ho gayi! Room code jald hi milega.');
            } else {
                alert('Pehle wallet mein paise add karein!');
            }
        }
    </script>
</body>
</html>
