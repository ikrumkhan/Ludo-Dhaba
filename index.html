<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoDhaba</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b061e] text-white font-sans antialiased pb-24">

    <!-- App Container -->
    <div class="max-w-md mx-auto min-h-screen relative shadow-2xl bg-[#0b061e]">

        <!-- Top Header / Balance Section -->
        <div class="flex justify-between items-center p-4 bg-[#140b32] border-b border-purple-950 sticky top-0 z-50 shadow">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-orange-600 flex items-center justify-center font-bold text-sm shadow">🎲</div>
                <span class="font-bold tracking-wide text-lg text-yellow-400">LudoDhaba</span>
            </div>
            <div class="bg-[#1f124a] px-3 py-1 rounded-lg border border-purple-500/30 text-xs">
                <p class="text-gray-400 text-[10px]">Wallet</p>
                <p id="headerWallet" class="font-bold text-green-400">₹500</p>
            </div>
        </div>

        <!-- Google Login Box -->
        <div class="p-4" id="loginBoxContainer">
            <div class="bg-[#140b32] p-4 rounded-xl border border-purple-900/50 text-center space-y-3 shadow-md">
                <h3 class="font-bold text-sm text-white">Account Access</h3>
                <p class="text-xs text-gray-400">Google Account se safe login karein!</p>
                <button id="googleLoginBtn" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-2.5 px-4 rounded-lg text-xs flex items-center justify-center space-x-2 shadow transition">
                    <i class="fa-brands fa-google text-red-500 text-base"></i>
                    <span>Sign in with Google</span>
                </button>
                <div id="userProfileDisplay" class="hidden text-xs text-green-400 font-semibold space-y-1">
                    <p id="welcomeUserText"></p>
                    <button id="googleLogoutBtn" class="text-[10px] bg-red-600 text-white px-2 py-1 rounded">Logout</button>
                </div>
            </div>
        </div>

        <!-- Main Banner Buttons -->
        <div class="px-4 space-y-3">
            <button class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-lg flex items-center justify-center space-x-2">
                <span>🚀 Room Code Share Karein & Jeetein!</span>
            </button>
            <button class="w-full bg-gradient-to-r from-red-600 to-rose-600 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-lg">
                + Create Challenge
            </button>
        </div>

        <!-- Active Battles Section -->
        <div class="p-4 space-y-3">
            <h3 class="font-bold text-sm text-gray-200">Active Battles</h3>
            <div class="bg-[#140b32] p-3.5 rounded-xl border border-purple-900/50 flex justify-between items-center shadow-md">
                <div>
                    <p class="text-xs text-gray-400">Creator: <span class="text-white font-semibold">Sameem Khan</span></p>
                    <p class="text-xs text-gray-300 mt-0.5">Room: <span class="text-yellow-400 font-bold">LUDO7245</span></p>
                    <p class="text-xs font-bold text-green-400 mt-1">Entry: ₹100</p>
                </div>
                <button class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-xs font-bold text-white shadow">Join</button>
            </div>
        </div>

        <!-- Wallet & Deposit / Withdrawal Section -->
        <div class="p-4 space-y-4">
            <div class="bg-[#140b32] p-4 rounded-xl border border-purple-900/50 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm text-yellow-400"><i class="fa-solid fa-wallet"></i> My Wallet</h3>
                    <div class="space-x-1">
                        <button onclick="toggleTab('deposit')" class="bg-green-600 text-white px-2.5 py-1 rounded text-[11px] font-bold shadow">Add Money</button>
                        <button onclick="toggleTab('withdraw')" class="bg-red-600 text-white px-2.5 py-1 rounded text-[11px] font-bold shadow">Withdraw</button>
                    </div>
                </div>

                <!-- Deposit Box -->
                <div id="depositTab" class="space-y-3 bg-[#1f124a] p-3 rounded-lg border border-purple-500/20">
                    <h4 class="font-bold text-xs text-white">Add Money via QR / UPI</h4>
                    <p class="text-[11px] text-gray-300">Scan QR or pay to UPI: <span class="text-yellow-400 font-bold">sameem@upi</span></p>
                    <div class="w-28 h-28 mx-auto bg-white p-1 rounded flex items-center justify-center text-black text-xs font-bold shadow">
                        [ QR Code ]
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400">Enter Amount</label>
                        <input type="number" id="depositAmount" placeholder="e.g. 500" class="w-full bg-[#140b32] border border-purple-500/40 rounded-lg px-3 py-2 text-xs text-white mt-0.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400">12-Digit UTR / Transaction ID</label>
                        <input type="text" id="utrNumber" placeholder="e.g. 3352xxxxxxxx" class="w-full bg-[#140b32] border border-purple-500/40 rounded-lg px-3 py-2 text-xs text-white mt-0.5 focus:outline-none">
                    </div>
                    <button id="submitDepBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-lg text-xs shadow">Submit Deposit Request</button>
                </div>

                <!-- Withdrawal Box -->
                <div id="withdrawTab" class="hidden space-y-3 bg-[#1f124a] p-3 rounded-lg border border-purple-500/20">
                    <h4 class="font-bold text-xs text-white">Withdraw Money to UPI / Bank</h4>
                    <div>
                        <label class="text-[10px] text-gray-400">Withdrawal Amount (Min ₹100)</label>
                        <input type="number" id="withdrawAmount" placeholder="Enter Amount" class="w-full bg-[#140b32] border border-purple-500/40 rounded-lg px-3 py-2 text-xs text-white mt-0.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400">Enter UPI ID (PhonePe/GooglePay)</label>
                        <input type="text" id="userUpi" placeholder="username@oksbi" class="w-full bg-[#140b32] border border-purple-500/40 rounded-lg px-3 py-2 text-xs text-white mt-0.5 focus:outline-none">
                    </div>
                    <button id="submitWitBtn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-xs shadow">Request Withdrawal</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#120826] border-t border-purple-900/60 flex justify-around py-2.5 px-2 z-50 text-xs shadow-lg">
            <a href="#" class="flex flex-col items-center text-purple-400">
                <i class="fa-solid fa-gamepad text-base"></i>
                <span class="text-[10px]">Play</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-wallet text-base"></i>
                <span class="text-[10px]">Wallet</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px]">Profile</span>
            </a>
        </div>

    </div>

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfdUuf53Xi6bxx7Jrd38CGXYNAWnb0QYs",
            authDomain: "ludo-badsah.firebaseapp.com",
            databaseURL: "https://ludo-badsah-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ludo-badsah",
            storageBucket: "ludo-badsah.firebasestorage.app",
            messagingSenderId: "1008082585739",
            appId: "1:1008082585739:web:8368c16ccde324a9956c8e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Google Login
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        });

        // Google Logout
        document.getElementById('googleLogoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error(error);
            }
        });

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('googleLoginBtn').classList.add('hidden');
                document.getElementById('userProfileDisplay').classList.remove('hidden');
                document.getElementById('welcomeUserText').textContent = "Hi, " + user.displayName;
            } else {
                document.getElementById('googleLoginBtn').classList.remove('hidden');
                document.getElementById('userProfileDisplay').classList.add('hidden');
            }
        });

        // Submit Deposit
        document.getElementById('submitDepBtn').addEventListener('click', async () => {
            const amount = document.getElementById('depositAmount').value;
            const utr = document.getElementById('utrNumber').value;

            if (!amount || !utr) {
                alert('Kripya Amount aur UTR Number dono bharein!');
                return;
            }

            try {
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser ? currentUser.uid : "guest",
                    name: currentUser ? currentUser.displayName : "Guest",
                    amount: Number(amount),
                    utr: utr,
                    status: "Pending",
                    timestamp: new Date()
                });
                alert('Deposit request bhej di gayi hai! Admin verification ke baad wallet update hoga.');
                document.getElementById('depositAmount').value = '';
                document.getElementById('utrNumber').value = '';
            } catch (e) {
                alert('Error: ' + e.message);
            }
        });

        // Submit Withdrawal
        document.getElementById('submitWitBtn').addEventListener('click', async () => {
            const amount = document.getElementById('withdrawAmount').value;
            const upi = document.getElementById('userUpi').value;

            if (!amount || !upi) {
                alert('Kripya Amount aur UPI ID dono bharein!');
                return;
            }
            if (Number(amount) < 100) {
                alert('Minimum withdrawal amount ₹100 hai!');
                return;
            }

            try {
                await addDoc(collection(db, "withdrawals"), {
                    uid: currentUser ? currentUser.uid : "guest",
                    name: currentUser ? currentUser.displayName : "Guest",
                    amount: Number(amount),
                    upiId: upi,
                    status: "Pending",
                    timestamp: new Date()
                });
                alert('Withdrawal request jama ho gayi hai! Jaldi payment bhej di jayegi.');
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('userUpi').value = '';
            } catch (e) {
                alert('Error: ' + e.message);
            }
        });
    </script>

    <!-- UI Script -->
    <script>
        function toggleTab(tab) {
            const depositTab = document.getElementById('depositTab');
            const withdrawTab = document.getElementById('withdrawTab');
            if(tab === 'deposit') {
                depositTab.classList.remove('hidden');
                withdrawTab.classList.add('hidden');
            } else {
                depositTab.classList.add('hidden');
                withdrawTab.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
