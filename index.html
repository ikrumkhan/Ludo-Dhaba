<!-- Firebase SDK & Functional Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚠️ Yahan apni khud ki Firebase Project ki details daalein (Jo aapne Firebase Console se li thi)
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
        projectId: "YOUR_FIREBASE_PROJECT_ID",
        storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
        messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
        appId: "YOUR_FIREBASE_APP_ID"
    };

    // Initialize Firebase (Agar pehle se initialized nahi hai)
    let app, auth;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
    } catch(e) {
        console.log("Firebase already initialized or config error");
    }

    const googleBtn = document.getElementById('googleLoginBtn');
    if(googleBtn && auth) {
        const provider = new GoogleAuthProvider();
        googleBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                alert("Login Successful! Welcome " + result.user.displayName);
                // Yahan aap user ka naam screen par dikha sakte hain
            } catch (error) {
                alert("Google Login Error: " + error.message);
            }
        });
    }
</script>

<script>
    // Tab switching for Add Money and Withdraw
    function toggleTab(tab) {
        const depositTab = document.getElementById('depositTab');
        const withdrawTab = document.getElementById('withdrawTab');
        if(!depositTab || !withdrawTab) return;
        
        if(tab === 'deposit') {
            depositTab.classList.remove('hidden');
            withdrawTab.classList.add('hidden');
        } else {
            depositTab.classList.add('hidden');
            withdrawTab.classList.remove('hidden');
        }
    }

    // Submit Deposit Function
    function submitDeposit() {
        const amount = document.getElementById('depositAmount').value;
        const utr = document.getElementById('utrNumber').value;
        if(!amount || !utr) {
            alert('Kripya Amount aur UTR Number dono bharein!');
            return;
        }
        alert('Deposit request bhej di gayi hai! Verification ke baad balance update ho jayega.');
    }

    // Submit Withdrawal Function
    function submitWithdrawal() {
        const amount = document.getElementById('withdrawAmount').value;
        const upi = document.getElementById('userUpi').value;
        if(!amount || !upi) {
            alert('Kripya Amount aur UPI ID dono bharein!');
            return;
        }
        alert('Withdrawal request safalpurvak jama ho gayi hai!');
    }
</script>
