<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoDhaba - साइट पर काम चल रहा है</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b061e] text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#140b32] border border-purple-900/60 p-6 rounded-2xl text-center space-y-5 shadow-2xl">
        <div class="w-20 h-20 bg-gradient-to-tr from-yellow-500 to-orange-500 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-lg animate-bounce">
            🛠️
        </div>

        <div class="space-y-2">
            <h1 class="text-xl font-bold text-yellow-400">वेबसाइट पर काम चल रहा है</h1>
            <p class="text-sm font-semibold text-gray-200">LudoDhaba जल्द ही एक नए और बेहतर रूप में वापस आएगी।</p>
        </div>

        <div class="bg-[#0b061e] p-4 rounded-xl border border-purple-500/30 text-xs text-gray-300 leading-relaxed space-y-2">
            <p>कृपया करके 10-12 दिन का इंतजार करें।</p>
            <p class="text-yellow-300 font-medium">वेबसाइट दोबारा से पूरा काम होने के बाद में आराम से खुल जाएगी।</p>
        </div>

        <div class="text-[10px] text-gray-500 pt-2">
            &copy; LudoDhaba. All Rights Reserved.
        </div>
    </div>

</html>
